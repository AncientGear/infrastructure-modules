apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-runtime-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required" .Values.serviceAccount.roleArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: backend-runtime
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: backend-runtime-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-runtime
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: backend-runtime
    kind: SecretStore
  target:
    name: backend-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ required "aws.secretName is required" .Values.aws.secretName | quote }}
        property: DATABASE_URL
    - secretKey: TOKEN_SECRET
      remoteRef:
        key: {{ required "aws.secretName is required" .Values.aws.secretName | quote }}
        property: TOKEN_SECRET
